[platformio]
; ESP-IDF main-komponent mappen
src_dir  = firmware/main
; SPIFFS frontend (pio run -t uploadfs)
data_dir = frontend

; ─────────────────────────────────────────────────────────────────────────────
; Primær build-target: generisk ESP32 (WROOM/WROVER)
; Skift board til f.eks. wt32-eth01 hvis du bruger det specifikke hardware
; ─────────────────────────────────────────────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = espidf

; Custom partition table med OTA + SPIFFS
board_build.partitions = firmware/partitions.csv

; SPIFFS image (upload: pio run -t uploadfs)
board_build.filesystem = spiffs

; sdkconfig defaults — kopieres til build-dir ved første build
board_build.sdkconfig = sdkconfig.defaults

; Flash og monitor
upload_speed   = 921600
monitor_speed  = 115200
monitor_filters =
    esp32_exception_decoder
    colorize
    time

; ─────────────────────────────────────────────────────────────────────────────
; Alternativ: WT32-ETH01 (har LAN8720 + ESP32 on-board)
; ─────────────────────────────────────────────────────────────────────────────
; [env:wt32-eth01]
; platform  = espressif32
; board     = wt32-eth01
; framework = espidf
; board_build.partitions = firmware/partitions.csv
; board_build.filesystem = spiffs
; board_build.sdkconfig  = sdkconfig.defaults
; upload_speed   = 921600
; monitor_speed  = 115200
; monitor_filters = esp32_exception_decoder, colorize, time
